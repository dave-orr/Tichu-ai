[package]
name = "tichu_engine"
version = "0.2.0"
edition = "2021"
description = "Tichu rules engine (a port of the tichu.squidbox.com engine) and a harness for testing Tichu bots"

[[bin]]
name = "tichu"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
debug = 1
