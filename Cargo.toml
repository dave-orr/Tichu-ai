[package]
name = "tichu_engine"
version = "0.2.0"
edition = "2021"
description = "Tichu rules engine (a port of the tichu.squidbox.com engine) and a harness for testing Tichu bots"

[[bin]]
name = "tichu"
path = "src/main.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
